<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CozinhaFlow - Sistema de Restaurante & KDS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#fff7ed', 100: '#ffedd5', 500: '#f97316', 600: '#ea580c', 700: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 9999px; }
    </style>
</head>
<body class="min-h-full flex flex-col font-sans antialiased">

    <!-- HEADER RESPONSIVO -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-purple-600 flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-utensils text-base sm:text-lg"></i>
                </div>
                <h1 class="text-base sm:text-xl font-bold tracking-tight text-white">CozinhaFlow <span class="text-[10px] sm:text-xs px-2 py-0.5 rounded-full bg-brand-500/20 text-brand-500 font-semibold border border-brand-500/30">TCC</span></h1>
            </div>

            <!-- MENU DE ABAS (Responsivo para Celular) -->
            <nav class="flex space-x-1 bg-slate-900/80 p-1 rounded-xl border border-slate-700/50 text-xs sm:text-sm">
                <button id="tab-waiter" onclick="switchTab('waiter')" class="flex items-center gap-1.5 px-2.5 sm:px-4 py-2 font-semibold rounded-lg text-white bg-brand-600 shadow-md transition">
                    <i class="fa-solid fa-receipt"></i> <span class="hidden xs:inline">Atendimento</span>
                </button>
                <button id="tab-kitchen" onclick="switchTab('kitchen')" class="flex items-center gap-1.5 px-2.5 sm:px-4 py-2 font-semibold rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition relative">
                    <i class="fa-solid fa-fire-burner"></i> <span class="hidden xs:inline">Cozinha</span>
                    <span id="kitchen-badge" class="hidden absolute -top-1 -right-1 px-1.5 py-0.2 text-[10px] font-bold bg-amber-500 text-slate-950 rounded-full">0</span>
                </button>
                <button id="tab-history" onclick="switchTab('history')" class="flex items-center gap-1.5 px-2.5 sm:px-4 py-2 font-semibold rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                    <i class="fa-solid fa-box-archive"></i> <span class="hidden xs:inline">Histórico</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- MAIN VIEWS -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 flex flex-col">

        <!-- VIEW 1: WAITER (ATENDIMENTO) -->
        <section id="view-waiter" class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6">
            <div class="lg:col-span-7 flex flex-col gap-4 sm:gap-6">
                
                <!-- SELEÇÃO DE MESAS (1 a 10) E CLIENTE -->
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-3.5 sm:p-4 shadow-xl space-y-3">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Selecione a Mesa (1 a 10)</label>
                        <div id="tables-container" class="grid grid-cols-5 gap-2">
                            <!-- Gerado via JS -->
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Nome do Cliente (Opcional)</label>
                        <input type="text" id="customer-input" placeholder="Ex: Carlos" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white text-xs sm:text-sm focus:outline-none focus:border-brand-500">
                    </div>
                </div>

                <!-- CATEGORIAS & PRODUTOS -->
                <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-none" id="categories-container"></div>
                <div class="grid grid-cols-2 sm:grid-cols-2 gap-3 sm:gap-4 overflow-y-auto max-h-[50vh] sm:max-h-[calc(100vh-350px)] pr-1" id="products-grid"></div>
            </div>

            <!-- CARRINHO / COMANDA -->
            <div class="lg:col-span-5 flex flex-col mt-4 lg:mt-0">
                <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl flex flex-col overflow-hidden">
                    <div class="px-4 sm:px-5 py-3.5 border-b border-slate-700 bg-slate-800 flex justify-between items-center">
                        <h2 class="font-bold text-white text-sm sm:text-base"><i class="fa-solid fa-cart-flatbed text-brand-500 mr-2"></i> Comanda Atual</h2>
                        <button onclick="clearCart()" class="text-xs text-slate-400 hover:text-red-400"><i class="fa-solid fa-trash"></i> Limpar</button>
                    </div>
                    <div class="max-h-48 sm:max-h-60 overflow-y-auto p-3.5 sm:p-4 space-y-2.5" id="cart-items-container"></div>
                    
                    <div class="p-3.5 sm:p-4 border-t border-slate-700 bg-slate-900/50 space-y-3">
                        <!-- OBSERVAÇÕES RÁPIDAS -->
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1.5">Observações Rápidas (Clique):</label>
                            <div class="flex flex-wrap gap-1.5 mb-2">
                                <button onclick="addObs('Sem cebola')" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-2 py-1 rounded-lg transition">+ Sem cebola</button>
                                <button onclick="addObs('Sem pimenta')" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-2 py-1 rounded-lg transition">+ Sem pimenta</button>
                                <button onclick="addObs('Bem passado')" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-2 py-1 rounded-lg transition">+ Bem passado</button>
                                <button onclick="addObs('Molho à parte')" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-2 py-1 rounded-lg transition">+ Molho à parte</button>
                            </div>
                            <textarea id="order-notes" rows="2" placeholder="Observações adicionais..." class="w-full p-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white resize-none"></textarea>
                        </div>

                        <!-- TOTAIS -->
                        <div class="space-y-1 text-xs sm:text-sm pt-2 border-t border-slate-800">
                            <div class="flex justify-between text-slate-400"><span>Subtotal</span><span id="cart-subtotal">R$ 0,00</span></div>
                            <div class="flex justify-between text-slate-400"><span>Taxa de Serviço (10%)</span><span id="cart-tax">R$ 0,00</span></div>
                            <div class="flex justify-between text-base sm:text-lg font-bold text-white pt-1 border-t border-slate-800"><span>Total</span><span id="cart-total" class="text
